spring:
  application:
    name: btg-fondos

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/btg_fondos}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

  initial-balance: ${INITIAL_BALANCE:500000}

  ses:
    enabled: ${SES_ENABLED:false}
    sender-email: ${SES_SENDER_EMAIL}
    region: ${SES_REGION:us-east-1}
